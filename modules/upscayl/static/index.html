<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upscayl</title>
  <!-- Relative URLs only: this page serves at /m/upscayl/ hosted and at / standalone. -->
  <link rel="stylesheet" href="static/vendor/darkglass.css">
  <link rel="stylesheet" href="static/vendor/panel.css">
  <link rel="stylesheet" href="static/vendor/module.css">
  <link rel="stylesheet" href="static/panel.css">
</head>
<body>
  <main class="upscayl-page" id="page" data-status="loading">
    <hd-report id="setup" severity="warning" hidden data-testid="setup"></hd-report>
    <hd-report id="error" severity="error" hidden data-testid="error"></hd-report>
    <hd-report id="dropped" severity="info" hidden data-testid="dropped"></hd-report>

    <div class="upscayl-panes">
      <hd-panel heading="Upscale" id="form" data-testid="form">
        <hd-props>
          <hd-radio-row id="mode" label="Mode" value="image">
            <option value="image">Image</option>
            <option value="batch">Folder</option>
          </hd-radio-row>
          <hd-path id="input" label="Image" kind="file" data-mode="image"
                   placeholder="Drop an image here, or paste its path"></hd-path>
          <hd-path id="output" label="Save to" kind="dir" data-mode="image"
                   placeholder="Empty: beside the image"></hd-path>
          <hd-path id="input_folder" label="Folder" kind="dir" data-mode="batch" hidden
                   placeholder="Drop images or a folder here, or paste its path"></hd-path>
          <hd-path id="output_folder" label="Save to" kind="dir" data-mode="batch" hidden
                   placeholder="Empty: inside the folder"></hd-path>
          <hd-enum id="model" label="Model" loading></hd-enum>
        </hd-props>
        <p class="upscayl-license" id="license" data-testid="license"></p>
        <hd-props>
          <hd-radio-row id="size_mode" label="Size" value="scale">
            <option value="scale">Scale</option>
            <option value="width">Width</option>
            <option value="resize">Exact</option>
          </hd-radio-row>
          <hd-number id="scale" label="Scale" value="4" min="1" max="16" step="1" integer unit="x" default="4"></hd-number>
          <hd-number id="width" label="Width" value="1920" min="1" step="1" integer unit="px" default="1920" hidden></hd-number>
          <hd-text id="resize" label="Exact size" value="1920x1080" default="1920x1080" mono hidden></hd-text>
          <hd-enum id="resize_filter" label="Filter" value="default" hidden>
            <option value="default">Default</option>
            <option value="box">Box</option>
            <option value="triangle">Triangle</option>
            <option value="cubicbspline">Cubic B-spline</option>
            <option value="catmullrom">Catmull-Rom</option>
            <option value="mitchell">Mitchell</option>
            <option value="pointsample">Point sample</option>
          </hd-enum>
          <hd-enum id="format" label="Format" value="png">
            <option value="png">PNG</option>
            <option value="jpg">JPEG</option>
            <option value="webp">WebP</option>
          </hd-enum>
          <hd-number id="compression" label="Compression" value="0" min="0" max="100" step="1" integer default="0"
                     tooltip="WebP only: higher is smaller and lossier" disabled></hd-number>
          <hd-checkbox id="tta" label="TTA (slower, sometimes cleaner)"></hd-checkbox>
          <hd-checkbox id="double_upscayl" label="Double upscayl"></hd-checkbox>
          <hd-checkbox id="copy_metadata" label="Copy metadata"></hd-checkbox>
          <hd-checkbox id="overwrite" label="Overwrite existing"></hd-checkbox>
        </hd-props>
        <hd-panel heading="Advanced" id="advanced" collapsed>
          <hd-props>
            <hd-text id="gpu_id" label="GPU" value="" placeholder="auto, 0, or 0,1" mono></hd-text>
            <hd-text id="tile_size" label="Tile size" value="0" default="0" mono></hd-text>
            <hd-text id="threads" label="Threads" value="" placeholder="load:proc:save" mono></hd-text>
            <hd-number id="model_scale" label="Model scale" value="0" min="0" max="4" step="1" integer default="0"
                       tooltip="0 reads it from the model name"></hd-number>
            <hd-text id="custom_model" label="Custom model" value=""
                     placeholder="a .param path, or upscayl:imported/<id>" mono></hd-text>
          </hd-props>
        </hd-panel>
        <div class="upscayl-actions">
          <hd-button id="start" variant="primary" data-hdeck-focus-first data-testid="start">Upscale</hd-button>
        </div>
      </hd-panel>

      <!-- What is running and what finished. A finished result opens in the Preview view. -->
      <hd-panel heading="Results" id="jobs-panel" data-testid="jobs">
        <div class="k-skeleton" id="jobs-skeleton"></div>
        <p class="pane-hint" id="jobs-empty" hidden>No results yet. Started jobs, and their outputs, appear here.</p>
        <ul class="upscayl-jobs" id="jobs"></ul>
      </hd-panel>
    </div>

    <!-- Shown while files are dragged over the view. -->
    <div class="upscayl-drop" id="drop" hidden aria-hidden="true">
      <p>Drop images or a folder to upscale</p>
    </div>
  </main>
  <script src="static/vendor/module.js"></script>
  <script src="static/vendor/kit.js"></script>
  <script src="static/common.js"></script>
  <script src="static/run.js"></script>
</body>
</html>
